 y=\"150\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"#2b3440\">z. B. Stahl</text></svg>","long":"Empfindliche Teile geben unter der Backe nach oder gehen kaputt. Das Programm begrenzt dann den Druck auf die Fläche. Es nimmt eine größere Backe, einen weicheren Belag oder meldet, dass es so nicht geht. Die Stufen reichen von sehr empfindlich über empfindlich, normal und fest bis unbegrenzt.","legend":["Backe","Eindruck im Teil"],"extra":"<table class=\"st\"><tr><th>Stufe</th><th>Höchstens</th><th>Etwa wie</th><th>Vergleichbar mit</th></tr>\n<tr><td><b>Sehr empfindlich</b></td><td>25 kPa<br><small>2,5 N/cm²</small></td><td>1 kg&nbsp;auf 2&nbsp;x&nbsp;2&nbsp;cm</td><td>Erdbeeren, Himbeeren, reife Tomaten, Pfirsiche</td></tr>\n<tr><td><b>Empfindlich</b></td><td>100 kPa<br><small>10 N/cm²</small></td><td>4 kg&nbsp;auf 2&nbsp;x&nbsp;2&nbsp;cm</td><td>Äpfel, Birnen, Kiwis, Gurken, Paprika</td></tr>\n<tr><td><b>Normal</b></td><td>300 kPa<br><small>30 N/cm²</small></td><td>12 kg&nbsp;auf 2&nbsp;x&nbsp;2&nbsp;cm</td><td>Milchkartons, Kartons, leere Kunststoffflaschen, Weichholz</td></tr>\n<tr><td><b>Fest</b></td><td>2 MPa<br><small>200 N/cm²</small></td><td>80 kg&nbsp;auf 2&nbsp;x&nbsp;2&nbsp;cm</td><td>massive Kunststoffteile, Gehäuse, Hartholz</td></tr>\n<tr><td><b>Unbegrenzt</b></td><td>keine Grenze</td><td></td><td>Stahl, Aluminium, Guss, Glas mit Belag</td></tr></table>\n<div class=\"pro\"><b>Pro-Modus:</b> Statt einer Stufe kannst du einen eigenen Wert eingeben, entweder als Druck in kPa oder als höchste Greifkraft je Backe in N, z. B. aus einem eigenen Versuch.</div>","tip":"Unsicher? Lieber eine Stufe empfindlicher wählen."},{"id":"masse","g":"Teil","title":"Masse","short":"Das Gewicht des Teils in Kilogramm.","a":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anch \" /><rect x=\"178\" y=\"86\" width=\"8\" height=\"22\" fill=\"#d6e2f5\" stroke=\"#2f6fd6\" stroke-width=\"1.6\" rx=\"2\" /><line x1=\"40\" y1=\"97\" x2=\"85\" y2=\"97\" stroke=\"#e07000\" stroke-width=\"3.5\"/><polygon points=\"93,97 85,101.4 85,92.6\" fill=\"#e07000\"/><line x1=\"240\" y1=\"97\" x2=\"195\" y2=\"97\" stroke=\"#e07000\" stroke-width=\"3.5\"/><polygon points=\"187,97 195,92.6 195,101.4\" fill=\"#e07000\"/><circle cx=\"140\" cy=\"97\" r=\"5.5\" fill=\"#fff\" stroke=\"#2b3440\" stroke-width=\"1.6\"/><path d=\"M140 91.5 A5.5 5.5 0 0 1 145.5 97 L140 97Z M140 102.5 A5.5 5.5 0 0 1 134.5 97 L140 97Z\" fill=\"#2b3440\"/><line x1=\"140\" y1=\"104\" x2=\"140\" y2=\"160\" stroke=\"#2b3440\" stroke-width=\"3\"/><polygon points=\"140,168 135.6,160 144.4,160\" fill=\"#2b3440\"/><circle cx=\"156\" cy=\"150\" r=\"8.5\" fill=\"#e07000\"/><text x=\"156\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">1</text><circle cx=\"60\" cy=\"82\" r=\"8.5\" fill=\"#e07000\"/><text x=\"60\" y=\"86\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">2</text></svg>","long":"Je schwerer das Teil, desto stärker zieht es nach unten und desto mehr Greifkraft ist nötig. Bei Behältern mit Inhalt gibst du das volle Gewicht an.","legend":["Gewichtskraft","Nötige Greifkraft"],"tip":"Am besten wiegen, nicht schätzen."},{"id":"wandstaerke","g":"Teil","title":"Hohlkörper und Wandstärke","short":"Ob das Teil innen hohl ist und wie dick seine Wand ist.","a":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">Dicke Wand</text><rect x=\"90\" y=\"40\" width=\"100\" height=\"110\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\" /><rect x=\"104\" y=\"54\" width=\"72\" height=\ -width=\"2.5\"/><polygon points=\"194,95 202,90.6 202,99.4\" fill=\"#e07000\"/><circle cx=\"92\" cy=\"30\" r=\"8.5\" fill=\"#e07000\"/><text x=\"92\" y=\"34\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">1</text><circle cx=\"140\" cy=\"95\" r=\"8.5\" fill=\"#e07000\"/><text x=\"140\" y=\"99\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">2</text></svg>","long":"Volle Teile oder dicke Wände halten die Greifkraft gut aus. Dünne Wände biegen sich nach innen. Das Programm rechnet aus der Wandstärke und dem Material, wie weit, und begrenzt die Kraft.","legend":["Wandstärke","Wand gibt nach"],"tip":"Bei Kunststoffflaschen und Dosen unbedingt angeben."},{"id":"fuellstand","g":"Teil","title":"Füllstand","short":"Wie voll der Behälter ist.","a":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">Fast leer</text><rect x=\"110\" y=\"40\" width=\"60\" height=\"124\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\" /><polygon points=\"110,40 140,26 170,40\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\"/><rect x=\"111.5\" y=\"150\" width=\"57\" height=\"12.5\" fill=\"#9cc3ea\" stroke=\"none\" stroke-width=\"1.6\" /><line x1=\"100\" y1=\"150\" x2=\"180\" y2=\"150\" stroke=\"#e07000\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><circle cx=\"140\" cy=\"120\" r=\"5.5\" fill=\"#fff\" stroke=\"#2b3440\" stroke-width=\"1.6\"/><path d=\"M140 114.5 A5.5 5.5 0 0 1 145.5 120 L140 120Z M140 125.5 A5.5 5.5 0 0 1 134.5 120 L140 120Z\" fill=\"#2b3440\"/><circle cx=\"194\" cy=\"150\" r=\"8.5\" fill=\"#e07000\"/><text x=\"194\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">1</text><circle cx=\"156\" cy=\"120\" r=\"8.5\" fill=\"#e07000\"/><text x=\"156\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">2</text><text x=\"140\" y=\"176\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"#6b7684\">leicht, Wand weich</text></svg>","b":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">Voll</text><rect x=\"110\" y=\"40\" width=\"60\" height=\"124\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\" /><polygon points=\"110,40 140,26 170,40\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\"/><rect x=\"111.5\" y=\"52\" width=\"57\" height=\"110.5\" fill=\"#9cc3ea\" stroke=\"none\" stroke-width=\"1.6\" /><line x1=\"100\" y1=\"52\" x2=\"180\" y2=\"52\" stroke=\"#e07000\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><circle cx=\"140\" cy=\"104\" r=\"5.5\" fill=\"#fff\" stroke=\"#2b3440\" stroke-width=\"1.6\"/><path d=\"M140 98.5 A5.5 5.5 0 0 1 145.5 104 L140 104Z M140 109.5 A5.5 5.5 0 0 1 134.5 104 L140 104Z\" fill=\"#2b3440\"/><circle cx=\"194\" cy=\"52\" r=\"8.5\" fill=\"#e07000\"/><text x=\"194\" y=\"56\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">1</text><circle cx=\"156\" cy=\"104\" r=\"8.5\" fill=\"#e07000\"/><text x=\"156\" y=\"108\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">2</text><text x=\"140\" y=\"176\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"#6b7684\">schwer, Inhalt stützt</text></svg>","long":"Ein voller Behälter ist schwerer und braucht mehr Kraft. Dafür stützt der Inhalt die Wand, bei verschlossenen Behältern auch die eingeschlossene Luft. Ein leerer Behälter ist leicht, aber die Wand knickt schnell ein. Der Schwerpunkt wandert mit dem Füllstand.","legend":["Füllhöhe","Schwerpunkt"],"tip":"Wenn es beides gibt (leer und voll), beide Fälle rechnen lassen."},{"id":"kopfraum","g":"Teil","title":"Kopfraum","short":"Die Luft über dem Inhalt in einem verschlossenen Behälter.","a":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">Kleiner Kopfraum</text><rect x=\"112\" y=\"36\" width=\"56\" height=\"128\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\" /><rect x=\"113.5\" y=\"37.5\" width=\"53\" height=\"14\" fill=\"#eef5fc\" stroke=\"none\" stroke-width=\"1.6\" /><rect x=\"113.5\" y=\"52\" width=\"53\" height=\"110.5\" fill=\"#9cc3ea\" stroke=\"none\" stroke-width=\"1.6\" /><line x1=\"140\" y1=\"46\" x2=\"133\" y2=\"46\" stroke=\"#e07000\" stroke-width=\"1.6\"/><polygon points=\"128,46 133,43.25 133,48.75\" fill=\"#e07000\"/><line x1=\"140\" y1=\"46\" x2=\"147\" y2=\"46\" stroke=\"#e07000\" stroke-width=\"1.6\"/><polygon points=\"152,46 147,48.75 147,43.25\" fill=\"#e07000\"/><circle cx=\"186\" cy=\"44\" r=\"8.5\" fill=\"#e07000\"/><text x=\"186\" y=\"48\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">1</text><circle cx=\"186\" cy=\"110\" r=\"8.5\" fill=\"#e07000\"/><text x=\"186\" y=\"114\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">2</text><text x=\"140\" y=\"178\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"#6b7684\">stützt stark</text></svg>","b":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">Großer Kopfraum</text><rect x=\"112\" y=\"36\" width=\"56\" height=\"128\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\" /><rect x=\"113.5\" y=\"37.5\" width=\"53\" height=\"64\" fill=\"#eef5fc\" stroke=\"none\" stroke-width=\"1.6\" /><rect x=\"113.5\" y=\"102\" width=\"53\" height=\"60.5\" fill=\"#9cc3ea\" stroke=\"none\" stroke-width=\"1.6\" /><circle cx=\"186\" cy=\"68\" r=\"8.5\" fill=\"#e07000\"/><text x=\"186\" y=\"72\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">1</text><circle cx=\"186\" cy=\"132\" r=\"8.5\" fill=\"#e07000\"/><text x=\"186\" y=\"136\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">2</text><text x=\"140\" y=\"178\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"#6b7684\">stützt wenig</text></svg>","long":"Drückt der Greifer die Wand ein, wird die eingeschlossene Luft zusammengepresst und drückt dagegen. Bei wenig Luft steigt der Druck schnell und die Wand bleibt stabil. Bei viel Luft gibt sie leichter nach.","legend":["Kopfraum (Luft)","Inhalt"],"tip":"Nur wichtig, wenn der Behälter dicht verschlossen ist."},{"id":"verschlossen","g":"Teil","title":"Verschlossen","short":"Ob der Behälter dicht verschlossen ist.","a":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">Offen</text><g transform=\"translate(0,10)\"><path d=\"M112 60 L128 46 L128 30 L152 30 L152 46 L168 60 L168 160 L112 160Z\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\"/><path d=\"M112 92 Q124 110 112 128\" stroke=\"#5b6672\" stroke-width=\"1.6\" fill=\"#f5f7fa\"/><rect x=\"102\" y=\"100\" width=\"10\" height=\"20\" fill=\"#d6e2f5\" stroke=\"#2f6fd6\" stroke-width=\"1.6\" rx=\"2\" /><line x1=\"140\" y1=\"40\" x2=\"140\" y2=\"26\" stroke=\"#e07000\" stroke-width=\"2\"/>< 158 144.4,158\" fill=\"#2b3440\"/><line x1=\"150\" y1=\"150\" x2=\"150\" y2=\"157\" stroke=\"#e0383b\" stroke-width=\"2.4\"/><polygon points=\"150,163 146.7,157 153.3,157\" fill=\"#e0383b\"/><circle cx=\"232\" cy=\"104\" r=\"8.5\" fill=\"#e07000\"/><text x=\"232\" y=\"108\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">1</text><circle cx=\"166\" cy=\"164\" r=\"8.5\" fill=\"#e07000\"/><text x=\"166\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">2</text></svg>","b":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">10 m/s²</text><rect x=\"94\" y=\"38\" width=\"92\" height=\"22\" fill=\"#9aa4b0\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"4\"/><rect x=\"130\" y=\"28\" width=\"20\" height=\"10\" fill=\"#9aa4b0\" stroke=\"#5b6672\" stroke-width=\"1.6\" /><rect x=\"102\" y=\"60\" width=\"10\" height=\"60\" fill=\"#b6bec8\" stroke=\"#5b6672\" stroke-width=\"1.6\" /><rect x=\"168\" y=\"60\" width=\"10\" height=\"60\" fill=\"#b6bec8\" stroke=\"#5b6672\" stroke-width=\"1.6\" /><rect x=\"110\" y=\"104\" width=\"6\" height=\"16\" fill=\"#d6e2f5\" stroke=\"#2f6fd6\" stroke-width=\"1.6\" rx=\"2\" /><rect x=\"164\" y=\"104\" width=\"6\" height=\"16\" fill=\"#d6e2f5\" stroke=\"#2f6fd6\" stroke-width=\"1.6\" rx=\"2\" /><rect x=\"116\" y=\"82\" width=\"48\" height=\"66\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\" /><line x1=\"214\" y1=\"140\" x2=\"214\" y2=\"70\" stroke=\"#e07000\" stroke-width=\"3.2\"/><polygon points=\"214,62 218.4,70 209.6,70\" fill=\"#e07000\"/><line x1=\"140\" y1=\"150\" x2=\"140\" y2=\"158\" stroke=\"#2b3440\" stroke-width=\"2\"/><polygon points=\"140,166 135.6,158 144.4,158\" fill=\"#2b3440\"/><line x1=\"150\" y1=\"150\" -anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2b3440\">50 N</text><text x=\"20\" y=\"118\" text-anchor=\"start\" font-size=\"10.5\" font-weight=\"400\" fill=\"#2b3440\">Eingestellt</text><rect x=\"20\" y=\"124\" width=\"100\" height=\"26\" fill=\"#b6bec8\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\"/><rect x=\"120\" y=\"124\" width=\"50\" height=\"26\" fill=\"rgba(224,112,0,.25)\" stroke=\"#e07000\" stroke-width=\"1.6\" rx=\"3\"/><text x=\"176\" y=\"142\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"#2b3440\">75 N</text><circle cx=\"134\" cy=\"77\" r=\"8.5\" fill=\"#e07000\"/><text x=\"134\" y=\"81\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">1</text><circle cx=\"145\" cy=\"112\" r=\"8.5\" fill=\"#e07000\"/><text x=\"145\" y=\"116\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">2</text><text x=\"145\" y=\"166\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"#e07000\">Reserve</text></svg>","b":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">Faktor 2</text><text x=\"20\" y=\"58\" text-anchor=\"start\" font-size=\"10.5\" font-weight=\"400\" fill=\"#2b3440\">Berechnet</text><rect x=\"20\" y=\"64\" width=\"100\" height=\"26\" fill=\"#b6bec8\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\"/><text x=\"70\" y=\"81\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#2b3440\">50 N</text><text x=\"20\" y=\"118\" text-anchor=\"start\" font-size=\"10.5\" font-weight=\"400\" fill=\"#2b3440\">Eingestellt</text><rect x=\"20\" y=\"124\" width=\"100\" height=\"26\" fill=\"#b6bec8\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\"/><rect x=\"120\" y=\"124\" width=\"100\" height=\"26\" fill=\"rgba(224,112,0,.25)\" stroke=\"#e07000\" stroke-width=\"1.6\" rx=\"3\"/><text x=\"226\" y=\"142\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"#2b3440\">100 N</text><circle cx=\"134\" cy=\"77\" r=\"8.5\" fill=\"#e07000\"/><text x=\"134\" y=\"81\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">1</text><circle cx=\"170\" cy=\"112\" r=\"8.5\" fill=\"#e07000\"/><text x=\"170\" y=\"116\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">2</text><text x=\"170\" y=\"166\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"#e07000\">Reserve</text></svg>","long":"Das Programm rechnet die nötige Kraft aus und multipliziert sie mit dem Faktor. Die Reserve deckt Dinge ab, die man nicht genau kennt, z. B. Verschleiß des Belags oder leicht andere Teile. Im Normalmodus ist der Faktor fest 2. Im Pro-Modus kannst du 1,5 bis 2 wählen.","legend":["Berechnete Kraft","Reserve"],"tip":"Nur verringern, wenn alle Werte gut bekannt sind."},{"id":"oberflaeche","g":"Umgebung","title":"Oberflächenzustand","short":"Ob die Oberfläche trocken, nass, ölig oder staubig ist.","a":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">Trocken</text><rect x=\"40\" y=\"40\" width=\"200\" height=\"50\" fill=\"#d6e2f5\" stroke=\"#2f6fd6\" stroke-width=\"1.6\" rx=\"2\" /><text x=\"140\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"400\" fill=\"#2b3440\">Backe mit Belag</text><rect x=\"40\" y=\"90\" width=\"200\" height=\"60\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\" /><text x=\"140\" y=\"126\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"400\" fill=\"#2b3440\">Teil</text><circle cx=\"254\" cy=\"90\" r=\"10\" fill=\"#1fa35a\" g und Backen aus Kunststoff werden bei Wärme weich und verlieren Kraft. Das Programm schlägt nur Werkstoffe vor, die die Temperatur aushalten.","legend":["Temperatur in der Halle","Belag und Backen"],"tip":"Den höchsten Wert im Jahr angeben, z. B. im Sommer."},{"id":"produkttemperatur","g":"Umgebung","title":"Produkttemperatur","short":"Die Temperatur des Teils, wenn es gegriffen wird.","a":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">20 °C</text><rect x=\"88\" y=\"38\" width=\"104\" height=\"22\" fill=\"#9aa4b0\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"4\"/><rect x=\"130\" y=\"28\" width=\"20\" height=\"10\" fill=\"#9aa4b0\" stroke=\"#5b6672\" stroke-width=\"1.6\" /><rect x=\"96\" y=\"60\" width=\"10\" height=\"54\" fill=\"#b6bec8\" stroke=\"#5b6672\" stroke-width=\"1.6\" /><rect x=\"174\" y=\"60\" width=\"10\" height=\"54\" fill=\"#b6bec8\" stroke=\"#5b6672\" stroke-width=\"1.6\" /><rect x=\"104\" y=\"98\" width=\"6\" height=\"16\" fill=\"#d6e2f5\" stroke=\"#2f6fd6\" stroke-width=\"1.6\" rx=\"2\" /><rect x=\"170\" y=\"98\" width=\"6\" height=\"16\" fill=\"#d6e2f5\" stroke=\"#2f6fd6\" stroke-width=\"1.6\" rx=\"2\" /><rect x=\"110\" y=\"80\" width=\"60\" height=\"70\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\" /><circle cx=\"140\" cy=\"116\" r=\"8.5\" fill=\"#e07000\"/><text x=\"140\" y=\"120\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">1</text><circle cx=\"196\" cy=\"92\" r=\"8.5\" fill=\"#e07000\"/><text x=\"196\" y=\"96\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">2</text><circle cx=\"140\" cy=\"166\" r=\"10\" fill=\"#1fa35a\"/><path d=\"M135 166 l3.5 3.5 l6 -7\" stroke=\"#fff\" stroke-width=\"2.4\" fill=\"none\"/></svg>  Belag möglich</text></svg>","long":"Heiße Teile erwärmen den Belag an der Kontaktstelle. Unter Druck wird Kunststoff schon unterhalb seiner normalen Grenztemperatur weich. Das Programm prüft das und schlägt z. B. Silikon oder Metall statt ABS vor.","legend":["Heißes Teil","Belag an der Kontaktstelle"],"tip":"Temperatur direkt beim Greifen angeben, nicht beim Herstellen."},{"id":"luftfeuchte","g":"Umgebung","title":"Luftfeuchte","short":"Wie feucht die Luft ist, in Prozent.","a":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">40 %</text><rect x=\"96\" y=\"50\" width=\"88\" height=\"100\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\" /><rect x=\"96\" y=\"50\" width=\"88\" height=\"100\" fill=\"#d9b98c\" stroke=\"#8b6b3e\" stroke-width=\"1.6\" rx=\"3\"/><rect x=\"84\" y=\"86\" width=\"12\" height=\"28\" fill=\"#d6e2f5\" stroke=\"#2f6fd6\" stroke-width=\"1.6\" rx=\"2\" /><rect x=\"184\" y=\"86\" width=\"12\" height=\"28\" fill=\"#d6e2f5\" stroke=\"#2f6fd6\" stroke-width=\"1.6\" rx=\"2\" /><line x1=\"44\" y1=\"100\" x2=\"74\" y2=\"100\" stroke=\"#e07000\" stroke-width=\"2.5\"/><polygon points=\"82,100 74,104.4 74,95.6\" fill=\"#e07000\"/><line x1=\"236\" y1=\"100\" x2=\"206\" y2=\"100\" stroke=\"#e07000\" stroke-width=\"2.5\"/><polygon points=\"198,100 206,95.6 206,104.4\" fill=\"#e07000\"/><circle cx=\"140\" cy=\"100\" r=\"10\" fill=\"#1fa35a\"/><path d=\"M135 100 l3.5 3.5 l6 -7\" stroke=\"#fff\" stroke-width=\"2.4\" fill=\"none\"/><text x=\"140\" y=\"170\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"#6b7684\">Karton fest</text></svg>","b":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"> abelle. Manche Kombinationen sind gesperrt, z. B. Stahl auf Glas, weil das Teil Schaden nehmen kann.","legend":["Berührfläche zwischen Belag und Teil"],"tip":"Bei beschichteten Teilen die Beschichtung wählen."},{"id":"fingerbelag","g":"Backe","title":"Fingerbelag","short":"Das Material auf den Greiferfingern, das das Teil berührt.","a":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">Harter Kunststoff</text><circle cx=\"140\" cy=\"100\" r=\"46\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\"/><rect x=\"70\" y=\"70\" width=\"20\" height=\"60\" fill=\"#e3e6ea\" stroke=\"#5b6672\" stroke-width=\"1.6\" /><rect x=\"190\" y=\"70\" width=\"20\" height=\"60\" fill=\"#e3e6ea\" stroke=\"#5b6672\" stroke-width=\"1.6\" /><circle cx=\"94\" cy=\"100\" r=\"3.5\" fill=\"#e07000\" stroke=\"#e07000\" stroke-width=\"1.6\"/><circle cx=\"186\" cy=\"100\" r=\"3.5\" fill=\"#e07000\" stroke=\"#e07000\" stroke-width=\"1.6\"/><circle cx=\"80\" cy=\"58\" r=\"8.5\" fill=\"#e07000\"/><text x=\"80\" y=\"62\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">1</text><circle cx=\"104\" cy=\"86\" r=\"8.5\" fill=\"#e07000\"/><text x=\"104\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">2</text><text x=\"140\" y=\"170\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"#6b7684\">kleine Kontaktstelle</text></svg>","b":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">Gummi</text><circle cx=\"140\" cy=\"100\" r=\"46\ 36\" fill=\"#d6e2f5\" stroke=\"#2f6fd6\" stroke-width=\"1.6\" rx=\"2\" /><line x1=\"90\" y1=\"110\" x2=\"98\" y2=\"110\" stroke=\"#e07000\" stroke-width=\"2\"/><polygon points=\"106,110 98,114.4 98,105.6\" fill=\"#e07000\"/><line x1=\"190\" y1=\"110\" x2=\"182\" y2=\"110\" stroke=\"#e07000\" stroke-width=\"2\"/><polygon points=\"174,110 182,105.6 182,114.4\" fill=\"#e07000\"/><line x1=\"140\" y1=\"60\" x2=\"140\" y2=\"76\" stroke=\"#e0383b\" stroke-width=\"2.4\"/><polygon points=\"140,84 135.6,76 144.4,76\" fill=\"#e0383b\"/><circle cx=\"70\" cy=\"110\" r=\"8.5\" fill=\"#e07000\"/><text x=\"70\" y=\"114\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">1</text><circle cx=\"220\" cy=\"60\" r=\"10\" fill=\"#e0383b\"/><path d=\"M216 56 l8 8 M224 56 l-8 8\" stroke=\"#fff\" stroke-width=\"2.4\"/><text x=\"140\" y=\"176\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"#e0383b\">Teil rutscht</text></svg>","b":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">Ausreichend</text><rect x=\"116\" y=\"84\" width=\"48\" height=\"60\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\" /><rect x=\"108\" y=\"92\" width=\"8\" height=\"36\" fill=\"#d6e2f5\" stroke=\"#2f6fd6\" stroke-width=\"1.6\" rx=\"2\" /><rect x=\"164\" y=\"92\" width=\"8\" height=\"36\" fill=\"#d6e2f5\" stroke=\"#2f6fd6\" stroke-width=\"1.6\" rx=\"2\" /><line x1=\"56\" y1=\"110\" x2=\"98\" y2=\"110\" stroke=\"#e07000\" stroke-width=\"3.4\"/><polygon points=\"106,110 98,114.4 98,105.6\" fill=\"#e07000\"/><line x1=\"224\" y1=\"110\" x2=\"182\" y2=\"110\" stroke=\"#e07000\" stroke-width=\"3.4\"/><polygon points=\"174,110 182,105.6 182,114.4\" fill=\"#e07000\"/><line x1=\"140\" y1=\"146\" x2=\"140\" y2=\"162\" stroke=\"#2b3440\" stroke-width=\"2\"/><polygon points=\"140,170 135.6,162 144.4,162\" fill=\"#2b3440\"/><circle cx=\"70\" cy=\"96\" r=\"8.5\" fill=\"#e07000\"/><text x=\"70\" y=\"100\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">1</text><circle cx=\"156\" cy=\"168\" r=\"8.5\" fill=\"#e07000\"/><text x=\"156\" y=\"172\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">2</text><circle cx=\"220\" cy=\"60\" r=\"10\" fill=\"#1fa35a\"/><path d=\"M215 60 l3.5 3.5 l6 -7\" stroke=\"#fff\" stroke-width=\"2.4\" fill=\"none\"/></svg>","long":"Das Programm berechnet die Kraft aus Gewicht, Beschleunigung, Reibwert und Sicherheitsfaktor. Ist sie zu klein, rutscht das Teil. Ist sie zu groß, kann das Teil Schaden nehmen. Darum prüft das Programm auch die Belastbarkeit.","legend":["Greifkraft","Gewicht"],"tip":"Der Wert ist die Kraft je Backe."},{"id":"ampel","g":"Berechnung","title":"Ampel","short":"Das Ergebnis auf einen Blick.","a":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">Grün</text><rect x=\"30\" y=\"40\" width=\"40\" height=\"110\" fill=\"#2b3440\" stroke=\"#2b3440\" stroke-width=\"1.6\" rx=\"8\"/><circle cx=\"50\" cy=\"62\" r=\"12\" fill=\"#4a5260\" stroke=\"none\" stroke-width=\"1.6\"/><circle cx=\"50\" cy=\"95\" r=\"12\" fill=\"#4a5260\" stroke=\"none\" stroke-width=\"1.6\"/><circle cx=\"50\" cy=\"128\" r=\"12\" fill=\"#1fa35a\" stroke=\"none\" stroke-width=\"1.6\"/><rect x=\"140\" y=\"60\" width=\"60\" height=\"90\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\" /><rect x=\"134\" y=\"92\" width=\"6\" height=\"24\" fill=\"#1fa35a\" stroke=\"#1fa35a\" stroke-width=\"1.6\" /><rect x=\"200\" y=\"92\" width=\"6\" height=\"24\" fill=\"#1fa35a\" stroke=\"#1fa35a\" stroke-width=\"1.6\" /><text x=\"170\" y=\"170\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"#1fa35a\">Passt mit Reserve</text></svg>","b":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 180\" width=\"280\" height=\"180\" font-family=\"Segoe UI,Arial,sans-serif\"><rect width=\"280\" height=\"180\" rx=\"8\" fill=\"#f5f7fa\"/><text x=\"140\" y=\"17\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2b3440\">Rot</text><rect x=\"30\" y=\"40\" width=\"40\" height=\"110\" fill=\"#2b3440\" stroke=\"#2b3440\" stroke-width=\"1.6\" rx=\"8\"/><circle cx=\"50\" cy=\"62\" r=\"12\" fill=\"#e0383b\" stroke=\"none\" stroke-width=\"1.6\"/><circle cx=\"50\" cy=\"95\" r=\"12\" fill=\"#4a5260\" stroke=\"none\" stroke-width=\"1.6\"/><circle cx=\"50\" cy=\"128\" r=\"12\" fill=\"#4a5260\" stroke=\"none\" stroke-width=\"1.6\"/><rect x=\"140\" y=\"60\" width=\"60\" height=\"90\" fill=\"#c3cbd4\" stroke=\"#5b6672\" stroke-width=\"1.6\" rx=\"3\" /><rect x=\"134\" y=\"92\" width=\"6\" height=\"24\" fill=\"#e0383b\" stroke=\"#e0383b\" stroke-width=\"1.6\" /><rect x=\"200\" y=\"92\" width=\"6\" height=\"24\" fill=\"#e0383b\" stroke=\"#e0383b\" stroke-width=\"1.6\" /><text x=\"170\" y=\"170\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"400\" fill=\"#e0383b\">So nicht möglich</text></svg>","long":"Grün heißt: Alles passt mit Reserve. Gelb heißt: Es passt knapp oder ein Wert ist unsicher, z. B. ein Reibwert ohne Messung. Bitte prüfen oder testen. Rot heißt: So geht es nicht. Das Programm zeigt dann, was helfen würde.","legend":[],"tip":"Bei Gelb ist ein kurzer Greiftest mit dem echten Teil sinnvoll."}];</script><script>
document.body.innerHTML=F.map(f=>`<div class="card" id="${f.id}"><div class="x">✕</div><div class="g">${f.g}</div><h2>${f.title}</h2><div class="s">${f.short}</div><div class="imgs">${f.a}${f.b}</div><div class="l">${f.long}</div>${f.legend.length?`<div class="leg">${f.legend.map((t,i)=>`<div><span>${i+1}</span>${t}</div>`).join('')}</div>`:''}${f.extra||''}<div class="tip">${f.tip}</div></div>`).join('');window.READY=1;
</script></body></html>
